name: Publish Reading Desk
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'VERSION'
      - 'scripts/web_assets.py'
      - 'tests/figure-explanation-entry-browser.cjs'
      - 'tests/review-reader-browser.cjs'
      - 'tests/reading-map-data.cjs'
      - 'tests/map-language.mjs'
      - 'tests/scientific-translation.mjs'
      - 'tests/selection-engine-browser.cjs'
      - 'tests/fixtures/translation-selection.pdf'
      - 'tests/caption-flow.cjs'
      - 'tests/subject-glossary-browser.cjs'
      - 'tests/translation-transfer.mjs'
      - 'tests/translation-*.cjs'
      - 'tests/translation-session.mjs'
      - 'tests/translation-evidence.mjs'
      - 'tests/translation-benchmark/**'
      - 'tests/provider-test.py'
      - 'preview.py'
      - 'reading_questions.py'
      - 'reading_providers.py'
      - 'tests/portable-update-browser.cjs'
      - 'tests/paper-map-browser.cjs'
      - 'tests/tour-media.py'
      - 'tests/fixtures/tour-scenes.json'
      - 'scripts/record-walkthrough.cjs'
      - 'tests/obsidian-browser.cjs'
      - 'tests/cross-page-reader-browser.cjs'
      - 'tests/journal-layout-browser.cjs'
      - 'tests/public-search.cjs'
      - 'tests/personal-api-browser.cjs'
      - 'tests/personal-api-fixture.cjs'
      - 'tests/serve-https.py'
      - 'tests/panel-evidence.cjs'
      - 'tests/figure-elements.cjs'
      - 'tests/raster-legend-browser.cjs'
      - 'tests/fixtures/*legend.pdf'
      - 'docs/film/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-desk-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble the reader and public walkthrough
        run: |
          mkdir -p _site/read _site/film
          python3 scripts/web_assets.py _site/read
          cp -a dist/media/tour/. _site/
          cp -a docs/film/. _site/film/
          test -s _site/read/index.html
          test -s _site/cover-en.webp
          test -s _site/cover-zh.webp
          test -s _site/film/en.html
      - name: Test the reader at its public subpath
        timeout-minutes: 20
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-qa" --no-audit --no-fund playwright-core@1.65.1
          export NODE_PATH="$RUNNER_TEMP/reader-qa/node_modules"
          # The browser libraries and FFmpeg come from Ubuntu's signed archives.
          mkdir -p "$RUNNER_TEMP/reader-apt-sources"
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.list; do
            if [ -f "$source" ]; then cp "$source" "$RUNNER_TEMP/reader-apt-sources/"; fi
          done
          printf 'Dir::Etc::sourceparts "%s";\nAcquire::Retries "3";\n' "$RUNNER_TEMP/reader-apt-sources" > "$RUNNER_TEMP/reader-apt.conf"
          sudo env APT_CONFIG="$RUNNER_TEMP/reader-apt.conf" "$(command -v node)" "$NODE_PATH/playwright-core/cli.js" install-deps chromium webkit
          node "$NODE_PATH/playwright-core/cli.js" install chromium webkit
          python3 -m http.server 8174 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/reader-http.log" 2>&1 &
          server_pid=$!
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' -keyout "$RUNNER_TEMP/reader.key" -out "$RUNNER_TEMP/reader.crt" 2>/dev/null
          export READER_TEST_CERT="$RUNNER_TEMP/reader.crt" READER_TEST_KEY="$RUNNER_TEMP/reader.key"
          python3 tests/serve-https.py _site 8175 "$RUNNER_TEMP/reader.crt" "$RUNNER_TEMP/reader.key" >"$RUNNER_TEMP/reader-https.log" 2>&1 &
          tls_pid=$!
          trap 'kill "$server_pid" "$tls_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8174/read/VERSION
          node tests/reading-map-data.cjs
          node tests/map-language.mjs
          node tests/caption-flow.cjs
          node tests/scientific-translation.mjs
          node tests/translation-session.mjs
          node tests/translation-evidence.mjs
          python3 tests/provider-test.py
          python3 tests/translation-benchmark/verify-acceptance.py
          node tests/translation-transfer.mjs
          node tests/selection-engine-browser.cjs http://127.0.0.1:8174/read/
          node tests/selection-engine-browser.cjs http://127.0.0.1:8174/read/ --isolated-faults
          READER_BROWSER=webkit node tests/selection-engine-browser.cjs http://127.0.0.1:8174/read/ --healthy
          node tests/translation-workflow-browser.cjs http://127.0.0.1:8174/read/
          READER_BROWSER=webkit node tests/translation-workflow-browser.cjs http://127.0.0.1:8174/read/
          node tests/translation-cache-browser.cjs http://127.0.0.1:8174/read/
          node tests/translation-lifecycle-browser.cjs http://127.0.0.1:8174/read/
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -c "$RUNNER_TEMP/reader-apt.conf" install -y ffmpeg
          fi
          python3 tests/tour-media.py
          node tests/paper-map-browser.cjs http://127.0.0.1:8174/read/
          node tests/subject-glossary-browser.cjs http://127.0.0.1:8174/read/
          node tests/portable-update-browser.cjs http://127.0.0.1:8174/read/
          node tests/panel-evidence.cjs
          node tests/figure-elements.cjs
          node tests/public-search.cjs
          curl --fail --silent --cacert "$RUNNER_TEMP/reader.crt" --retry 10 --retry-connrefused https://127.0.0.1:8175/read/VERSION
          node tests/personal-api-browser.cjs https://127.0.0.1:8175/read/
          READER_BROWSER=webkit node tests/personal-api-browser.cjs https://127.0.0.1:8175/read/
          node tests/cross-page-reader-browser.cjs http://127.0.0.1:8174/read/
          node tests/journal-layout-browser.cjs http://127.0.0.1:8174/read/
          node tests/raster-legend-browser.cjs http://127.0.0.1:8174/read/
          node tests/figure-explanation-entry-browser.cjs http://127.0.0.1:8174/read/
          READER_BROWSER=webkit node tests/figure-explanation-entry-browser.cjs http://127.0.0.1:8174/read/
          node tests/review-reader-browser.cjs http://127.0.0.1:8174/read/
          READER_BROWSER=webkit node tests/review-reader-browser.cjs http://127.0.0.1:8174/read/
          node tests/obsidian-browser.cjs http://127.0.0.1:8174/read/
          READER_BROWSER=webkit node tests/obsidian-browser.cjs http://127.0.0.1:8174/read/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish at the permanent Pages address
        id: publish
        uses: actions/deploy-pages@v5
