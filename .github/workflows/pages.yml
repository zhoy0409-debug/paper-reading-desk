name: Publish Reading Desk
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'docs/film/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-desk-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble the reader and public walkthrough
        run: |
          mkdir -p _site/read _site/film
          cp -a dist/. _site/read/
          cp -a dist/media/tour/. _site/
          cp -a docs/film/. _site/film/
          test -s _site/read/index.html
          test -s _site/cover-en.webp
          test -s _site/cover-zh.webp
          test -s _site/film/en.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish at the permanent Pages address
        id: publish
        uses: actions/deploy-pages@v4
